name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Check form key
        if: ${{ vars.WEB3FORMS_KEY == '' }}
        run: echo "::warning::WEB3FORMS_KEY is not set, so the website forms can't send emails. Add it under Settings > Secrets and variables > Actions > Variables."

      - name: Build static site
        run: npx vite build
        env:
          NODE_ENV: production
          VITE_STATIC_SITE: "true"
          VITE_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Serve the app for unknown paths too, so direct links still load
      - run: cp dist/public/index.html dist/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
